name: Ratbat
options:
  bundleIdPrefix: se.jonasjohansson.ratbat
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  RatbatCore:
    type: framework
    platform: [macOS, iOS]
    sources:
      - path: RatbatCore
        excludes:
          - Tests
    info:
      path: RatbatCore/Info.plist
      properties:
        CFBundleName: RatbatCore
        CFBundleDisplayName: RatbatCore
        CFBundleIdentifier: se.jonasjohansson.ratbat.core
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: RatbatCore
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  RatbatMac:
    type: application
    platform: macOS
    sources:
      - path: RatbatMac
      - path: Vendor/cloudflared/cloudflared
        type: file
        buildPhase: resources
      - path: Vendor/spotify-downloader-bundle
        type: folder
        buildPhase: resources
    dependencies:
      - target: RatbatCore_macOS
        link: true
        embed: true
    info:
      path: RatbatMac/Info.plist
      properties:
        CFBundleName: Ratbat
        CFBundleDisplayName: Ratbat
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright (c) 2026 Jonas Johansson"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.jonasjohansson.ratbat.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Hardened runtime blocks spawning unsigned child processes; we
        # bundle cloudflared and spawn it via Process, so keep it off
        # until we sign the full chain.
        ENABLE_HARDENED_RUNTIME: NO
  RatbatIOS:
    type: application
    platform: iOS
    sources:
      - RatbatIOS
    dependencies:
      - target: RatbatCore_iOS
        link: true
        embed: true
    info:
      path: RatbatIOS/Info.plist
      properties:
        CFBundleName: Ratbat
        CFBundleDisplayName: Ratbat
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.jonasjohansson.ratbat.ios
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  RatbatCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RatbatCore/Tests
        excludes:
          - Fixtures
      - path: RatbatCore/Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: RatbatCore_macOS
schemes:
  RatbatCore:
    build:
      targets:
        RatbatCore_macOS: all
        RatbatCoreTests: [test]
    test:
      targets:
        - RatbatCoreTests
